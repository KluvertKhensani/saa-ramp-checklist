name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase configuration
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLIC_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "ERROR: VITE_SUPABASE_PROJECT_URL secret is missing or empty."
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ERROR: VITE_SUPABASE_PUBLIC_KEY secret is missing or empty."
            exit 1
          fi

          case "$VITE_SUPABASE_URL" in
            https://*.supabase.co)
              echo "Supabase URL format is valid."
              ;;
            *)
              echo "ERROR: Supabase URL must resemble https://project-reference.supabase.co"
              exit 1
              ;;
          esac

          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*|eyJ*)
              echo "Supabase publishable key format is recognised."
              ;;
            *)
              echo "ERROR: The Supabase public key does not look valid."
              exit 1
              ;;
          esac

          echo "Supabase build configuration is present."

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_PROJECT_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLIC_KEY }}

      - name: Verify deployment output
        shell: bash
        run: |
          set -euo pipefail

          test -f dist/index.html
          test -f dist/404.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

          workbox_file="$(find dist -maxdepth 1 -type f -name 'workbox-*.js' -print -quit)"

          if [ -z "$workbox_file" ]; then
            echo "ERROR: The Workbox runtime file was not generated."
            exit 1
          fi

          echo "Verified GitHub Pages output:"
          echo "- dist/index.html"
          echo "- dist/404.html"
          echo "- dist/manifest.webmanifest"
          echo "- dist/sw.js"
          echo "- $workbox_file"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages site
        id: deployment
        uses: actions/deploy-pages@v4
